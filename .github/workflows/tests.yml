name: Tests

# The daily workflow runs the tests on main, before it publishes anything. This
# runs them on every pull request — Dependabot's version bumps included, which
# are otherwise merged on nothing but their changelog — with no secrets and a
# token that can only read.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      # Settings for both are in pyproject.toml.
      - name: Lint
        run: python -m ruff check .

      - name: Types
        run: python -m mypy

      - run: python -m pytest tests/ -q
