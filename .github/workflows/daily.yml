name: Daily refresh

# The whole cycle, without a machine of your own left on: fetch results and
# prices, rebuild the model, re-price the card, send the pick to Telegram, and
# publish the site to Pages.

on:
  schedule:
    # 09:00 UTC = 12:00 in Sofia while summer time is in force, 11:00 after the
    # clocks go back. GitHub cron only speaks UTC, so the local hour drifts by
    # one in winter; change this to "0 10 * * *" if that matters.
    - cron: "0 9 * * *"
  workflow_dispatch:          # the Run workflow button
    inputs:
      args:
        description: "Extra flags for `fb.py run`, e.g. --no-odds or --sports soccer_epl"
        required: false
        default: ""
  push:
    branches: [main]
    paths:                    # code changes rebuild; a ledger commit must not
      - "**.py"
      - "requirements*.txt"
      - ".github/workflows/daily.yml"

# Nothing by default; each job asks for what it uses and no more. The refresh
# job pushes the ledger, the deploy job publishes Pages, the verdict job
# needs nothing at all.
permissions:
  contents: read

# Never let two runs overlap. They write the same CSVs, and the ledger commit
# of one would land on top of the other's.
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write         # the ledger is committed back after each run
    outputs:
      run: ${{ steps.run.outcome }}
    # The API keys are not here: a job-level variable is in every step's
    # environment, pip's and the tests' included. They are given to the one
    # step that spends them.
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the ledger step rebases onto whatever landed while
          # the run was going, and a rebase on a depth-1 clone is a coin toss.
          # The repo is under a megabyte, so this costs nothing.
          fetch-depth: 0
          # Left in .git/config, the token that can push would be readable by
          # every step after this one — every package pip installs among them.
          # The ledger step brings it back for itself.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Actions are pinned to commits and packages to releases: a moved tag or
      # a new major version reaches this run only through a Dependabot PR.
      - run: pip install -r requirements-dev.txt

      - name: Tests
        # A broken build must not publish, and must not post a pick.
        run: python -m pytest tests/ -q

      # Everything under data/ except the ledger is derived, but restoring it
      # is what keeps the card whole: the price files are the fixture list and
      # the odds history nothing else sells, and odds_quota.json remembers the
      # day the quota resets. The spending does not depend on it — `fb.py run`
      # paces itself on the API's own count of the credits left.
      - name: Restore the data folder
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data
          key: hub-data-${{ github.run_id }}
          restore-keys: hub-data-

      # The cache is saved even after a failed run, so the ledger it brings
      # back may be one that run cut short — and restoring it overwrites the
      # committed one. A book that is not the committed one plus new rows and
      # filled-in results is put back to the commit before anything reads it.
      - name: Check the restored ledger
        run: python fb.py check-ledger --restore

      # Allowed to fail so that the ledger is still committed and the site
      # still published from what is on hand. A stage that failed on a bug
      # makes it exit 1, and the `verdict` job turns the run red for it once
      # everything else has gone out.
      #
      # The extra flags reach the shell through the environment, never through
      # `${{ }}`: an expression is pasted into the script before bash reads
      # it, so a value like `; curl … $ODDS_API_KEY` would have run as a
      # command with the secrets in scope. From a variable it can only ever be
      # arguments — and it has to look like flags to get that far.
      - name: Fetch, rebuild, re-price and notify
        id: run
        continue-on-error: true
        env:
          EXTRA_ARGS: ${{ inputs.args }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Empty secrets are not an error: the run reports the notification
          # as unconfigured and still publishes.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ ! "$EXTRA_ARGS" =~ ^[-A-Za-z0-9_.,=\ ]*$ ]]; then
            echo "::error::The extra flags may hold only letters, digits, spaces and - _ . , ="
            exit 1
          fi
          set -f    # no globbing: the words are passed as they were typed
          python -u fb.py run --only-if-changed $EXTRA_ARGS

      - name: Save the data folder
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data
          key: hub-data-${{ github.run_id }}

      # The one file in data/ that cannot be rebuilt. Every pick is written
      # down before its match and graded afterwards, so losing it loses the
      # only out-of-sample record the project has.
      - name: Commit the ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Refuses a book that is not the committed one plus new rows.
          python fb.py check-ledger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add data/best_picks.csv data/best_accas.csv
          if git diff --cached --quiet; then
            echo "No new picks or gradings."
          else
            git commit -m "Ledger: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - name: Export the site
        run: python fb.py export

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  # Last, so that a bug in one stage still leaves the ledger committed and the
  # site published — and still turns the run red, which is the part somebody
  # sees. A provider's bad afternoon exits 0 and never reaches here.
  verdict:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.run == 'failure'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "::error::A stage of fb.py run failed on a bug. The ledger and the site went out on what was on hand; the refresh log names the stage."
          exit 1
