# Optional, per clone: `pip install pre-commit`, then `pre-commit install`.
#
# Local hooks on purpose. They run the ruff and mypy that requirements-dev.txt
# pins — the same versions CI runs — rather than fetching hook repositories
# at whatever revision someone last wrote here. Settings are in pyproject.toml.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        types: [python]
        pass_filenames: false
