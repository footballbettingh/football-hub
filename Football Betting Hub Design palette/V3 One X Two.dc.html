<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>body { margin: 0; }</style>
</helmet>

<div style="min-height:100vh; background:oklch(0.96 0.006 60); font-family:'Space Grotesk',Helvetica,sans-serif; color:oklch(0.2 0.008 60); padding:48px 40px 72px; display:flex; flex-direction:column; gap:44px;">

  <div style="display:flex; flex-direction:column; gap:6px;">
    <div style="font-size:26px; font-weight:700; letter-spacing:-0.015em;">Variant 3 — 1 X 2</div>
    <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:oklch(0.52 0.02 60);">the market itself as the mark — instantly "betting", no ball</div>
  </div>

  <div style="display:flex; align-items:center; gap:56px; flex-wrap:wrap;">
    <svg viewBox="0 0 100 100" style="width:200px; height:200px;">
      <circle cx="50" cy="50" r="50" fill="oklch(0.21 0.01 60)"></circle>
      <rect x="14" y="38" width="22" height="24" rx="4" fill="oklch(0.68 0.17 45)"></rect>
      <text x="25" y="55" text-anchor="middle" font-family="'Space Grotesk', Helvetica, sans-serif" font-weight="700" font-size="15" fill="oklch(0.16 0.01 60)">1</text>
      <rect x="39" y="38" width="22" height="24" rx="4" fill="none" stroke="oklch(0.55 0.015 60)" stroke-width="1.4"></rect>
      <text x="50" y="55" text-anchor="middle" font-family="'Space Grotesk', Helvetica, sans-serif" font-weight="700" font-size="15" fill="oklch(0.75 0.01 60)">X</text>
      <rect x="64" y="38" width="22" height="24" rx="4" fill="none" stroke="oklch(0.55 0.015 60)" stroke-width="1.4"></rect>
      <text x="75" y="55" text-anchor="middle" font-family="'Space Grotesk', Helvetica, sans-serif" font-weight="700" font-size="15" fill="oklch(0.75 0.01 60)">2</text>
      <text x="50" y="76" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="8" letter-spacing="2" fill="oklch(0.68 0.17 45)">FBH</text>
    </svg>
    <div style="display:flex; align-items:flex-end; gap:30px;">
      <svg viewBox="0 0 100 100" style="width:64px; height:64px;">
        <circle cx="50" cy="50" r="50" fill="oklch(0.21 0.01 60)"></circle>
        <rect x="12" y="35" width="24" height="30" rx="5" fill="oklch(0.68 0.17 45)"></rect>
        <text x="24" y="57" text-anchor="middle" font-family="'Space Grotesk', Helvetica, sans-serif" font-weight="700" font-size="20" fill="oklch(0.16 0.01 60)">1</text>
        <rect x="38" y="35" width="24" height="30" rx="5" fill="none" stroke="oklch(0.55 0.015 60)" stroke-width="1.8"></rect>
        <text x="50" y="57" text-anchor="middle" font-family="'Space Grotesk', Helvetica, sans-serif" font-weight="700" font-size="20" fill="oklch(0.75 0.01 60)">X</text>
        <rect x="64" y="35" width="24" height="30" rx="5" fill="none" stroke="oklch(0.55 0.015 60)" stroke-width="1.8"></rect>
        <text x="76" y="57" text-anchor="middle" font-family="'Space Grotesk', Helvetica, sans-serif" font-weight="700" font-size="20" fill="oklch(0.75 0.01 60)">2</text>
      </svg>
      <svg viewBox="0 0 100 100" style="width:40px; height:40px;">
        <circle cx="50" cy="50" r="50" fill="oklch(0.21 0.01 60)"></circle>
        <rect x="12" y="32" width="24" height="36" rx="5" fill="oklch(0.68 0.17 45)"></rect>
        <text x="24" y="59" text-anchor="middle" font-family="'Space Grotesk', Helvetica, sans-serif" font-weight="700" font-size="24" fill="oklch(0.16 0.01 60)">1</text>
        <rect x="38" y="32" width="24" height="36" rx="5" fill="none" stroke="oklch(0.55 0.015 60)" stroke-width="2.2"></rect>
        <text x="50" y="59" text-anchor="middle" font-family="'Space Grotesk', Helvetica, sans-serif" font-weight="700" font-size="24" fill="oklch(0.75 0.01 60)">X</text>
        <rect x="64" y="32" width="24" height="36" rx="5" fill="none" stroke="oklch(0.55 0.015 60)" stroke-width="2.2"></rect>
        <text x="76" y="59" text-anchor="middle" font-family="'Space Grotesk', Helvetica, sans-serif" font-weight="700" font-size="24" fill="oklch(0.75 0.01 60)">2</text>
      </svg>
      <svg viewBox="0 0 100 100" style="width:24px; height:24px;">
        <circle cx="50" cy="50" r="50" fill="oklch(0.21 0.01 60)"></circle>
        <rect x="14" y="30" width="26" height="40" rx="6" fill="oklch(0.68 0.17 45)"></rect>
        <rect x="46" y="30" width="26" height="40" rx="6" fill="none" stroke="oklch(0.62 0.015 60)" stroke-width="4"></rect>
      </svg>
    </div>
  </div>

  <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
    <div style="background:oklch(0.21 0.01 60); border-radius:16px; padding:44px 32px; display:flex; align-items:center; justify-content:center; gap:18px;">
      <div style="display:flex; gap:6px;">
        <div style="width:34px; height:42px; border-radius:7px; background:oklch(0.68 0.17 45); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:oklch(0.16 0.01 60);">1</div>
        <div style="width:34px; height:42px; border-radius:7px; border:1.6px solid oklch(0.42 0.012 60); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:oklch(0.75 0.01 60);">X</div>
        <div style="width:34px; height:42px; border-radius:7px; border:1.6px solid oklch(0.42 0.012 60); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:oklch(0.75 0.01 60);">2</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <div style="font-size:25px; font-weight:700; color:oklch(0.97 0.004 60); line-height:1; letter-spacing:-0.015em;">FOOTBALL</div>
        <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:oklch(0.68 0.17 45); letter-spacing:0.19em;">BETTING HUB</div>
      </div>
    </div>
    <div style="background:oklch(1 0 0); border:1px solid oklch(0.9 0.008 60); border-radius:16px; padding:44px 32px; display:flex; align-items:center; justify-content:center; gap:18px;">
      <div style="display:flex; gap:6px;">
        <div style="width:34px; height:42px; border-radius:7px; background:oklch(0.68 0.17 45); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:oklch(1 0 0);">1</div>
        <div style="width:34px; height:42px; border-radius:7px; border:1.6px solid oklch(0.82 0.01 60); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:oklch(0.3 0.01 60);">X</div>
        <div style="width:34px; height:42px; border-radius:7px; border:1.6px solid oklch(0.82 0.01 60); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:oklch(0.3 0.01 60);">2</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <div style="font-size:25px; font-weight:700; color:oklch(0.21 0.01 60); line-height:1; letter-spacing:-0.015em;">FOOTBALL</div>
        <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:oklch(0.52 0.14 45); letter-spacing:0.19em;">BETTING HUB</div>
      </div>
    </div>
  </div>

  <div style="display:flex; gap:12px;">
    <div style="width:64px; height:40px; border-radius:8px; background:oklch(0.21 0.01 60);"></div>
    <div style="width:64px; height:40px; border-radius:8px; background:oklch(0.68 0.17 45);"></div>
    <div style="width:64px; height:40px; border-radius:8px; background:oklch(0.96 0.006 60);"></div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 900, &quot;height&quot;: 640}}"></script>
</body>
</html>
